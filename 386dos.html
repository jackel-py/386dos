<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>386DOS Emulator</title>
  <style>
    :root {
      --bg: #0c0f14;
      --panel: #141a22;
      --panel-2: #1d2832;
      --text: #e8edf3;
      --muted: #9aa7b2;
      --accent: #5db7ff;
      --good: #5fe3a3;
      --warn: #f6d66e;
      --danger: #ff7d7d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    body { display: flex; flex-direction: column; }
    .toolbar {
      display: flex; gap: 10px; align-items: center; padding: 10px 12px;
      background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
      flex-wrap: wrap;
    }
    button, select {
      background: var(--panel-2); color: var(--text); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .status-pill {
      margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px;
    }
    .led {
      width: 10px; height: 10px; display: inline-block; border-radius: 50%; background: var(--good);
      box-shadow: 0 0 8px rgba(95,227,163,1);
    }
    .workspace {
      display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 12px; min-height: 0; flex: 1; padding: 12px;
    }
    .screen-panel, .sidebar {
      background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden;
    }
    .screen-panel {
      display: flex; align-items: stretch; justify-content: stretch; min-height: 0;
      background: #000;
    }
    canvas {
      width: 100%; height: 100%; display: block; background: #000;
      image-rendering: pixelated; outline: none;
    }
    .sidebar {
      display: flex; flex-direction: column; gap: 12px; padding: 12px; min-height: 0;
    }
    .section { display: flex; flex-direction: column; gap: 8px; }
    .title {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
      margin: 0 0 4px;
    }
    .metrics {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px;
    }
    .metric {
      background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 8px;
    }
    .metric small { display: block; color: var(--muted); }
    .metric strong { font-size: 14px; }
    pre, textarea {
      width: 100%; background: rgba(0,0,0,.25); color: var(--text); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; padding: 8px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      resize: none; min-height: 140px;
    }
    pre { white-space: pre-wrap; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="powerBtn">Power</button>
    <button id="resetBtn">Reset</button>
    <button id="pauseBtn">Pause</button>
    <button id="fullscreenBtn">Fullscreen</button>
    <button id="importBtn">Import File</button>
    <button id="factoryBtn">Factory Reset</button>
    <select id="cpuHz">
      <option value="4.77">4.77 MHz</option>
      <option value="8">8 MHz</option>
      <option value="12">12 MHz</option>
      <option value="16">16 MHz</option>
      <option value="20">20 MHz</option>
      <option value="25">25 MHz</option>
      <option value="33" selected>33 MHz</option>
    </select>
    <div class="status-pill"><span class="led"></span><span id="vmState">powered off</span></div>
  </div>

  <div class="workspace">
    <div class="screen-panel">
      <canvas id="display" width="720" height="400" tabindex="0" aria-label="Virtual display"></canvas>
    </div>
    <aside class="sidebar">
      <div class="section">
        <div class="title">Machine</div>
        <div class="metrics">
          <div class="metric"><small>CPU</small><strong>80386DX</strong></div>
          <div class="metric"><small>RAM</small><strong id="ramLabel">4 MB</strong></div>
          <div class="metric"><small>Mode</small><strong id="modeLabel">Real</strong></div>
          <div class="metric"><small>Clock</small><strong id="clockLabel">33 MHz</strong></div>
        </div>
      </div>

      <div class="section">
        <div class="title">Console</div>
        <pre id="consoleOutput">Intel 80386DX virtual BIOS POST initializing...\n</pre>
      </div>

      <div class="section">
        <div class="title">Debug</div>
        <textarea id="debugOutput" readonly>CPU halted. Press Power to boot.</textarea>
      </div>
    </aside>
  </div>

  <input id="fileInput" type="file" multiple hidden />

  <script>
    const KB = 1024;
    const MB = 1024 * KB;

    function logLine(text) {
      const out = document.getElementById('consoleOutput');
      out.textContent += String(text) + '\n';
      out.scrollTop = out.scrollHeight;
    }

    function hex8(v) { return '0x' + (v >>> 0).toString(16).padStart(2, '0'); }
    function hex16(v) { return '0x' + (v >>> 0).toString(16).padStart(4, '0'); }
    function hex32(v) { return '0x' + (v >>> 0).toString(16).padStart(8, '0'); }

    class Memory {
      constructor(size = 4 * MB) {
        this.size = size >>> 0;
        this.buffer = new ArrayBuffer(this.size);
        this.u8 = new Uint8Array(this.buffer);
        this.u16 = new Uint16Array(this.buffer);
        this.u32 = new Uint32Array(this.buffer);
      }
      read8(addr) {
        const a = addr >>> 0;
        if (a >= this.size) return 0;
        return this.u8[a] >>> 0;
      }
      write8(addr, value) {
        const a = addr >>> 0;
        if (a >= this.size) return;
        this.u8[a] = value & 0xFF;
      }
      read16(addr) {
        const a = addr >>> 0;
        if (a + 1 >= this.size) return 0;
        return this.u16[a >> 1] >>> 0;
      }
      write16(addr, value) {
        const a = addr >>> 0;
        if (a + 1 >= this.size) return;
        this.u16[a >> 1] = value & 0xFFFF;
      }
      read32(addr) {
        const a = addr >>> 0;
        if (a + 3 >= this.size) return 0;
        return this.u32[a >> 2] >>> 0;
      }
      write32(addr, value) {
        const a = addr >>> 0;
        if (a + 3 >= this.size) return;
        this.u32[a >> 2] = value >>> 0;
      }
      writeBytes(addr, bytes) {
        for (let i = 0; i < bytes.length; i++) this.write8(addr + i, bytes[i]);
      }
      readBytes(addr, len) {
        const out = new Uint8Array(len);
        for (let i = 0; i < len; i++) out[i] = this.read8(addr + i);
        return out;
      }
    }

    class IOBus {
      constructor() { this.devices = []; }
      register(device, start, end) { this.devices.push({ device, start, end }); }
      find(port) { return this.devices.find(d => port >= d.start && port <= d.end) || null; }
      in8(port) {
        const d = this.find(port);
        if (d && d.device.read8) return d.device.read8(port - d.start) & 0xFF;
        return 0;
      }
      out8(port, value) {
        const d = this.find(port);
        if (d && d.device.write8) d.device.write8(port - d.start, value & 0xFF);
      }
      in16(port) { return (this.in8(port) | (this.in8(port + 1) << 8)) >>> 0; }
      out16(port, value) {
        this.out8(port, value & 0xFF);
        this.out8(port + 1, (value >>> 8) & 0xFF);
      }
      in32(port) { return (this.in16(port) | (this.in16(port + 2) << 16)) >>> 0; }
      out32(port, value) {
        this.out16(port, value & 0xFFFF);
        this.out16(port + 2, (value >>> 16) & 0xFFFF);
      }
    }

    class CPU386 {
      constructor(mem, io, bios) {
        this.mem = mem;
        this.io = io;
        this.bios = bios;
        this.reset();
      }

      reset() {
        this.regs = {
          EAX: 0, EBX: 0, ECX: 0, EDX: 0,
          ESI: 0, EDI: 0, EBP: 0, ESP: 0x9FC00,
          EIP: 0xFFF0, CS: 0xF000, DS: 0, ES: 0, SS: 0, FS: 0, GS: 0,
          FLAGS: 0x02
        };
        this.mode = 'real';
        this.halted = false;
        this.lastInstr = 'NOP';
        this.lastOpcode = 0;
      }

      linear(seg, off) { return ((seg << 4) + (off >>> 0)) >>> 0; }
      read8Seg(seg, off) { return this.mem.read8(this.linear(seg, off)); }
      write8Seg(seg, off, val) { this.mem.write8(this.linear(seg, off), val & 0xFF); }
      read16Seg(seg, off) { return this.mem.read16(this.linear(seg, off)); }
      write16Seg(seg, off, val) { this.mem.write16(this.linear(seg, off), val & 0xFFFF); }
      read32Seg(seg, off) { return this.mem.read32(this.linear(seg, off)); }
      write32Seg(seg, off, val) { this.mem.write32(this.linear(seg, off), val >>> 0); }

      get AX(){ return this.regs.EAX & 0xFFFF; }
      set AX(v){ this.regs.EAX = (this.regs.EAX & 0xFFFF0000) | (v & 0xFFFF); }
      get AL(){ return this.regs.EAX & 0xFF; }
      set AL(v){ this.regs.EAX = (this.regs.EAX & 0xFFFFFF00) | (v & 0xFF); }
      get AH(){ return (this.regs.EAX >> 8) & 0xFF; }
      set AH(v){ this.regs.EAX = (this.regs.EAX & 0xFFFF00FF) | ((v & 0xFF) << 8); }
      get BX(){ return this.regs.EBX & 0xFFFF; }
      set BX(v){ this.regs.EBX = (this.regs.EBX & 0xFFFF0000) | (v & 0xFFFF); }
      get BL(){ return this.regs.EBX & 0xFF; }
      set BL(v){ this.regs.EBX = (this.regs.EBX & 0xFFFFFF00) | (v & 0xFF); }
      get BH(){ return (this.regs.EBX >> 8) & 0xFF; }
      set BH(v){ this.regs.EBX = (this.regs.EBX & 0xFFFF00FF) | ((v & 0xFF) << 8); }
      get CX(){ return this.regs.ECX & 0xFFFF; }
      set CX(v){ this.regs.ECX = (this.regs.ECX & 0xFFFF0000) | (v & 0xFFFF); }
      get CL(){ return this.regs.ECX & 0xFF; }
      set CL(v){ this.regs.ECX = (this.regs.ECX & 0xFFFFFF00) | (v & 0xFF); }
      get CH(){ return (this.regs.ECX >> 8) & 0xFF; }
      set CH(v){ this.regs.ECX = (this.regs.ECX & 0xFFFF00FF) | ((v & 0xFF) << 8); }
      get DX(){ return this.regs.EDX & 0xFFFF; }
      set DX(v){ this.regs.EDX = (this.regs.EDX & 0xFFFF0000) | (v & 0xFFFF); }
      get DL(){ return this.regs.EDX & 0xFF; }
      set DL(v){ this.regs.EDX = (this.regs.EDX & 0xFFFFFF00) | (v & 0xFF); }
      get DH(){ return (this.regs.EDX >> 8) & 0xFF; }
      set DH(v){ this.regs.EDX = (this.regs.EDX & 0xFFFF00FF) | ((v & 0xFF) << 8); }
      get SP(){ return this.regs.ESP & 0xFFFF; }
      set SP(v){ this.regs.ESP = (this.regs.ESP & 0xFFFF0000) | (v & 0xFFFF); }

      setFlag(name, value) {
        const masks = { CF: 1, PF: 4, AF: 16, ZF: 64, SF: 128, TF: 256, IF: 512, DF: 1024, OF: 4096 };
        if (value) this.regs.FLAGS |= masks[name];
        else this.regs.FLAGS &= ~masks[name];
        this.regs.FLAGS >>>= 0;
      }
      getFlag(name) {
        const masks = { CF: 1, PF: 4, AF: 16, ZF: 64, SF: 128, TF: 256, IF: 512, DF: 1024, OF: 4096 };
        return !!(this.regs.FLAGS & masks[name]);
      }

      fetchByte() {
        const v = this.mem.read8(this.linear(this.regs.CS, this.regs.EIP));
        this.regs.EIP = (this.regs.EIP + 1) >>> 0;
        return v & 0xFF;
      }
      fetchWord() { return (this.fetchByte() | (this.fetchByte() << 8)) >>> 0; }
      fetchDWord() { return (this.fetchWord() | (this.fetchWord() << 16)) >>> 0; }

      push16(v) {
        this.regs.ESP = (this.regs.ESP - 2) >>> 0;
        this.write16Seg(this.regs.SS, this.regs.ESP & 0xFFFF, v & 0xFFFF);
      }
      pop16() {
        const v = this.read16Seg(this.regs.SS, this.regs.ESP & 0xFFFF);
        this.regs.ESP = (this.regs.ESP + 2) >>> 0;
        return v >>> 0;
      }
      push32(v) {
        this.regs.ESP = (this.regs.ESP - 4) >>> 0;
        this.write32Seg(this.regs.SS, this.regs.ESP & 0xFFFF, v >>> 0);
      }
      pop32() {
        const v = this.read32Seg(this.regs.SS, this.regs.ESP & 0xFFFF);
        this.regs.ESP = (this.regs.ESP + 4) >>> 0;
        return v >>> 0;
      }

      handleInterrupt(vector) {
        const addr = vector * 4;
        const ip = this.mem.read16(addr) >>> 0;
        const cs = this.mem.read16(addr + 2) >>> 0;
        this.push16(this.regs.FLAGS);
        this.push16(this.regs.CS);
        this.push16(this.regs.EIP);
        this.regs.CS = cs;
        this.regs.EIP = ip;
        this.setFlag('IF', false);
      }

      step() {
        if (this.halted) return 0;
        const opcode = this.mem.read8(this.linear(this.regs.CS, this.regs.EIP));
        this.lastOpcode = opcode;

        switch (opcode) {
          case 0x90:
            this.lastInstr = 'NOP';
            this.regs.EIP = (this.regs.EIP + 1) >>> 0;
            return 1;

          case 0xB8: case 0xB9: case 0xBA: case 0xBB: case 0xBC: case 0xBD: case 0xBE: case 0xBF: {
            const regs = ['EAX','ECX','EDX','EBX','ESP','EBP','ESI','EDI'];
            const index = opcode & 7;
            const imm = this.fetchDWord();
            this.regs[regs[index]] = imm >>> 0;
            this.lastInstr = 'MOV ' + regs[index] + ', imm32';
            return 1;
          }

          case 0xB0: case 0xB1: case 0xB2: case 0xB3: case 0xB4: case 0xB5: case 0xB6: case 0xB7: {
            const regs = ['EAX','ECX','EDX','EBX','ESP','EBP','ESI','EDI'];
            const index = opcode & 7;
            const imm = this.fetchByte();
            this.regs[regs[index]] = ((this.regs[regs[index]] & 0xFFFFFF00) | (imm & 0xFF)) >>> 0;
            this.lastInstr = 'MOV r8, imm8';
            return 1;
          }

          case 0x50: case 0x51: case 0x52: case 0x53: case 0x54: case 0x55: case 0x56: case 0x57: {
            const regs = ['EAX','ECX','EDX','EBX','ESP','EBP','ESI','EDI'];
            const index = opcode & 7;
            this.push32(this.regs[regs[index]] >>> 0);
            this.lastInstr = 'PUSH ' + regs[index];
            return 1;
          }

          case 0x58: case 0x59: case 0x5A: case 0x5B: case 0x5C: case 0x5D: case 0x5E: case 0x5F: {
            const regs = ['EAX','ECX','EDX','EBX','ESP','EBP','ESI','EDI'];
            const index = opcode & 7;
            const val = this.pop32();
            if (index === 4) this.regs.ESP = val >>> 0; else this.regs[regs[index]] = val >>> 0;
            this.lastInstr = 'POP ' + regs[index];
            return 1;
          }

          case 0x68: {
            const imm = this.fetchDWord();
            this.push32(imm);
            this.lastInstr = 'PUSH imm32';
            return 1;
          }

          case 0x6A: {
            const v = this.fetchByte();
            this.push32((v << 24) >> 24);
            this.lastInstr = 'PUSH imm8';
            return 1;
          }

          case 0x70: case 0x71: case 0x72: case 0x73: case 0x74: case 0x75: case 0x76: case 0x77:
          case 0x78: case 0x79: case 0x7A: case 0x7B: case 0x7C: case 0x7D: case 0x7E: case 0x7F: {
            const rel = (this.fetchByte() << 24) >> 24;
            let taken = false;
            const zf = this.getFlag('ZF');
            const sf = this.getFlag('SF');
            const of = this.getFlag('OF');
            const cf = this.getFlag('CF');
            switch (opcode) {
              case 0x74: taken = zf; break;
              case 0x75: taken = !zf; break;
              case 0x72: taken = cf; break;
              case 0x73: taken = !cf; break;
              case 0x76: taken = cf || zf; break;
              case 0x77: taken = !cf && !zf; break;
              case 0x7C: taken = sf !== of; break;
              case 0x7D: taken = sf === of; break;
              case 0x7E: taken = (sf !== of) || zf; break;
              case 0x7F: taken = (sf === of) && !zf; break;
            }
            if (taken) this.regs.EIP = (this.regs.EIP + rel) >>> 0;
            this.lastInstr = 'JCC';
            return 1;
          }

          case 0xE8: {
            const rel = this.fetchDWord();
            const target = (this.regs.EIP + rel) >>> 0;
            this.push32(this.regs.EIP);
            this.regs.EIP = target;
            this.lastInstr = 'CALL';
            return 1;
          }

          case 0xE9: {
            const rel = this.fetchDWord();
            this.regs.EIP = (this.regs.EIP + rel) >>> 0;
            this.lastInstr = 'JMP';
            return 1;
          }

          case 0xEB: {
            const rel = this.fetchByte();
            this.regs.EIP = (this.regs.EIP + ((rel << 24) >> 24)) >>> 0;
            this.lastInstr = 'JMP short';
            return 1;
          }

          case 0xC3: {
            this.regs.EIP = this.pop16();
            this.lastInstr = 'RET';
            return 1;
          }

          case 0xCD: {
            const vector = this.fetchByte();
            this.lastInstr = 'INT ' + vector;
            if (this.bios) this.bios.handleInterrupt(vector, this.regs);
            else this.handleInterrupt(vector);
            return 1;
          }

          case 0xCF: {
            this.regs.EIP = this.pop16();
            this.regs.CS = this.pop16();
            this.regs.FLAGS = this.pop16();
            this.lastInstr = 'IRET';
            return 1;
          }

          case 0xF8: { this.setFlag('CF', false); this.lastInstr = 'CLC'; return 1; }
          case 0xF9: { this.setFlag('CF', true); this.lastInstr = 'STC'; return 1; }
          case 0xFA: { this.setFlag('IF', false); this.lastInstr = 'CLI'; return 1; }
          case 0xFB: { this.setFlag('IF', true); this.lastInstr = 'STI'; return 1; }
          case 0xFC: { this.setFlag('DF', false); this.lastInstr = 'CLD'; return 1; }
          case 0xFD: { this.setFlag('DF', true); this.lastInstr = 'STD'; return 1; }

          case 0x9C: {
            this.push16(this.regs.FLAGS);
            this.lastInstr = 'PUSHF';
            return 1;
          }

          case 0x9D: {
            this.regs.FLAGS = this.pop16();
            this.lastInstr = 'POPF';
            return 1;
          }

          case 0xF4: {
            this.halted = true;
            this.lastInstr = 'HLT';
            return 1;
          }

          default:
            this.halted = true;
            this.lastInstr = 'UNSUPPORTED 0x' + opcode.toString(16).padStart(2, '0');
            return 0;
        }
      }

      getState() {
        return {
          EAX: this.regs.EAX, EBX: this.regs.EBX, ECX: this.regs.ECX, EDX: this.regs.EDX,
          ESI: this.regs.ESI, EDI: this.regs.EDI, EBP: this.regs.EBP, ESP: this.regs.ESP,
          EIP: this.regs.EIP, CS: this.regs.CS, DS: this.regs.DS, ES: this.regs.ES, SS: this.regs.SS,
          FS: this.regs.FS, GS: this.regs.GS, FLAGS: this.regs.FLAGS,
          mode: this.mode, halted: this.halted, lastInstr: this.lastInstr, lastOpcode: this.lastOpcode
        };
      }
    }

    class BIOS {
      constructor(mem, cpu) {
        this.mem = mem;
        this.cpu = cpu;
        this.lastError = null;
      }
      init() {
        for (let i = 0; i < 256; i++) {
          this.mem.write16(i * 4, 0);
          this.mem.write16(i * 4 + 2, 0);
        }
        this.setVector(0x10, 0xF000, 0xC000);
        this.setVector(0x13, 0xF000, 0xC000);
        this.setVector(0x15, 0xF000, 0xC000);
        this.setVector(0x16, 0xF000, 0xC000);
        this.setVector(0x1A, 0xF000, 0xC000);
        this.setVector(0x21, 0xF000, 0xC000);
        this.mem.write16(0x413, 0x4000 / 16);
      }
      setVector(intNo, seg, off) {
        const addr = intNo * 4;
        this.mem.write16(addr, off & 0xFFFF);
        this.mem.write16(addr + 2, seg & 0xFFFF);
      }
      handleInterrupt(vector, regs) {
        switch (vector) {
          case 0x10: return this.int10();
          case 0x13: return this.int13();
          case 0x15: return this.int15();
          case 0x16: return this.int16();
          case 0x1A: return this.int1A();
          case 0x21: return this.int21();
          default:
            this.lastError = { int: vector, detail: 'Unhandled BIOS vector' };
            return 0;
        }
      }
      int10() {
        const ah = (this.cpu.regs.EAX >> 8) & 0xFF;
        switch (ah) {
          case 0x00:
            this.cpu.mode = 'text';
            return 0;
          case 0x0E: {
            const vga = window.__vm && window.__vm.vga;
            if (vga) vga.putTextChar(this.cpu.AL, 0x07, 0);
            return 0;
          }
          case 0x02: {
            const vga = window.__vm && window.__vm.vga;
            if (vga) {
              const dx = this.cpu.DX;
              vga.cursorX = dx & 0xFF;
              vga.cursorY = (dx >> 8) & 0xFF;
            }
            return 0;
          }
          case 0x0F: {
            this.cpu.regs.EAX = (this.cpu.regs.EAX & 0xFF00) | 0x03;
            return 0;
          }
          default:
            this.lastError = { int: 0x10, ah, detail: 'Unhandled INT10h' };
            return 0;
        }
      }
      int13() {
        const ah = (this.cpu.regs.EAX >> 8) & 0xFF;
        switch (ah) {
          case 0x00:
            this.cpu.setFlag('CF', false);
            return 0;
          case 0x02: {
            const count = this.cpu.regs.EAX & 0xFF;
            const es = this.cpu.regs.ES;
            const bx = this.cpu.regs.EBX;
            const disk = window.__vm && window.__vm.disk;
            if (!disk) return 0;
            const cyl = (this.cpu.regs.ECX >> 8) & 0xFF;
            const head = (this.cpu.regs.ECX >> 16) & 0xFF;
            const sector = this.cpu.regs.ECX & 0x3F;
            for (let i = 0; i < count; i++) {
              const lba = disk.chsToLBA(cyl, head, sector + i);
              const sec = disk.readSector(lba);
              const base = this.cpu.linear(es, bx + i * 512);
              for (let b = 0; b < sec.length; b++) this.mem.write8(base + b, sec[b]);
            }
            this.cpu.setFlag('CF', false);
            return 0;
          }
          default:
            this.lastError = { int: 0x13, ah, detail: 'Unhandled INT13h' };
            return 0;
        }
      }
      int15() {
        this.cpu.regs.EBX = 0x55AA;
        this.cpu.setFlag('CF', false);
        return 0;
      }
      int16() {
        const ah = (this.cpu.regs.EAX >> 8) & 0xFF;
        const keyboard = window.__vm && window.__vm.keyboard;
        switch (ah) {
          case 0x00:
            this.cpu.regs.EAX = keyboard ? keyboard.readKey() : 0;
            return 0;
          case 0x01:
            this.cpu.regs.EAX = keyboard ? keyboard.hasKey() : 0;
            return 0;
          default:
            this.lastError = { int: 0x16, ah, detail: 'Unhandled INT16h' };
            return 0;
        }
      }
      int1A() {
        const d = new Date();
        const ah = (this.cpu.regs.EAX >> 8) & 0xFF;
        if (ah === 0x00) {
          this.cpu.regs.ECX = ((d.getHours() * 60 + d.getMinutes()) * 60 + d.getSeconds()) >>> 0;
          return 0;
        }
        return 0;
      }
      int21() {
        const ah = (this.cpu.regs.EAX >> 8) & 0xFF;
        const dos = window.__vm && window.__vm.dos;
        if (dos) return dos.handleInterrupt(ah, this.cpu);
        return 0;
      }
    }

    class VGA {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.mode = 0x03;
        this.cursorX = 0;
        this.cursorY = 0;
        this.fb = new Uint8Array(320 * 200);
        this.textBuffer = new Uint16Array(80 * 25);
      }
      putTextChar(ch, attr = 0x07, page = 0) {
        const idx = this.cursorY * 80 + this.cursorX;
        this.textBuffer[idx] = ((attr & 0xFF) << 8) | (ch & 0xFF);
        this.cursorX += 1;
        if (this.cursorX >= 80) { this.cursorX = 0; this.cursorY += 1; }
        this.renderText();
      }
      setMode(mode) {
        this.mode = mode;
        if (mode === 0x13) {
          this.canvas.width = 320;
          this.canvas.height = 200;
        } else {
          this.canvas.width = 720;
          this.canvas.height = 400;
        }
      }
      renderText() {
        const img = this.ctx.createImageData(720, 400);
        const data = img.data;
        const palette = [
          [0,0,0],[0,0,170],[0,170,0],[0,170,170],[170,0,0],[170,0,170],[170,85,0],[170,170,170],
          [85,85,85],[85,85,255],[85,255,85],[85,255,255],[255,85,85],[255,85,255],[255,255,85],[255,255,255]
        ];
        for (let y = 0; y < 25; y++) {
          for (let x = 0; x < 80; x++) {
            const v = this.textBuffer[y * 80 + x];
            const ch = v & 0xFF;
            const attr = (v >> 8) & 0xFF;
            const fg = attr & 0x0F;
            const bg = (attr >> 4) & 0x07;
            const sx = x * 9; const sy = y * 16;
            for (let yy = 0; yy < 16; yy++) {
              for (let xx = 0; xx < 8; xx++) {
                const bit = ((font8x16[(ch * 16) + yy] >> (7 - xx)) & 1) ? 1 : 0;
                const color = bit ? fg : bg;
                const rgb = palette[color % 16];
                const px = (sy + yy) * 720 + (sx + xx);
                const i = px * 4;
                data[i] = rgb[0]; data[i + 1] = rgb[1]; data[i + 2] = rgb[2]; data[i + 3] = 255;
              }
            }
          }
        }
        this.ctx.putImageData(img, 0, 0);
      }
      renderMode13() {
        const img = this.ctx.createImageData(320, 200);
        const data = img.data;
        const palette = [
          [0,0,0],[0,0,170],[0,170,0],[0,170,170],[170,0,0],[170,0,170],[170,85,0],[170,170,170],
          [85,85,85],[85,85,255],[85,255,85],[85,255,255],[255,85,85],[255,85,255],[255,255,85],[255,255,255]
        ];
        for (let i = 0; i < this.fb.length; i++) {
          const c = this.fb[i];
          const rgb = palette[c % 16];
          const p = i * 4;
          data[p] = rgb[0]; data[p + 1] = rgb[1]; data[p + 2] = rgb[2]; data[p + 3] = 255;
        }
        const off = document.createElement('canvas');
        off.width = 320; off.height = 200;
        const offCtx = off.getContext('2d');
        offCtx.putImageData(img, 0, 0);
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.drawImage(off, 0, 0, this.canvas.width, this.canvas.height);
      }
      refresh() {
        if (this.mode === 0x13) this.renderMode13(); else this.renderText();
      }
    }

    const font8x16 = new Uint8Array([
      0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00
    ]);

    class Keyboard {
      constructor() {
        this.queue = [];
        document.addEventListener('keydown', (e) => {
          e.preventDefault();
          const key = e.keyCode || e.which;
          const ascii = e.key && e.key.length === 1 ? e.key.charCodeAt(0) : 0;
          this.queue.push((key & 0xFF) | ((ascii & 0xFF) << 8));
        });
      }
      readKey() { return this.queue.length ? (this.queue.shift() >>> 0) : 0; }
      hasKey() { return this.queue.length > 0 ? 1 : 0; }
    }

    class VirtualDisk {
      constructor(sectors = 32768) {
        this.sectorSize = 512;
        this.totalSectors = sectors;
        this.data = new Uint8Array(this.totalSectors * this.sectorSize);
      }
      readSector(lba) {
        const off = lba * this.sectorSize;
        return this.data.slice(off, off + this.sectorSize);
      }
      writeSector(lba, bytes) {
        const off = lba * this.sectorSize;
        for (let i = 0; i < bytes.length; i++) this.data[off + i] = bytes[i];
      }
      chsToLBA(cyl, head, sector) {
        return ((((cyl * 2) + head) * 18 + (sector - 1)) >>> 0) % this.totalSectors;
      }
      initializeBootSector() {
        const sec = new Uint8Array(512);
        sec[510] = 0x55; sec[511] = 0xAA;
        this.writeSector(0, sec);
      }
    }

    class Fat16 {
      constructor() {
        this.files = new Map();
      }
      listDirectory(path = 'C:\\') {
        const base = path.toUpperCase();
        if (!base.endsWith('\\')) return [...this.files.keys()].filter(k => k.toUpperCase().startsWith(base));
        return [...this.files.keys()].filter(k => k.toUpperCase().startsWith(base));
      }
      createFile(path, contents = '') {
        this.files.set(path, contents);
      }
      readFile(path) {
        return this.files.get(path) || '';
      }
      writeFile(path, data) {
        this.files.set(path, data);
      }
      deleteFile(path) {
        this.files.delete(path);
      }
      exists(path) {
        return this.files.has(path);
      }
    }

    class DOSKernel {
      constructor() {
        this.fs = new Fat16();
        this.files = this.fs.files;
        this.currentDrive = 'C';
        this.currentDir = 'C:\\';
        this.env = { COMSPEC: 'C:\\COMMAND.COM', PATH: 'C:\\', TEMP: 'C:\\TEMP' };
        this.setupDefaults();
      }
      setupDefaults() {
        this.files.set('C:\\CONFIG.SYS', 'FILES=20\nBUFFERS=20\nLASTDRIVE=Z\n');
        this.files.set('C:\\AUTOEXEC.BAT', 'ECHO OFF\nPROMPT $P$G\n');
        this.files.set('C:\\COMMAND.COM', 'DOS command interpreter');
      }
      readString(cpu, seg, offset) {
        let out = '';
        let p = 0;
        while (true) {
          const ch = cpu.read8Seg(seg, offset + p);
          if (ch === 0) break;
          out += String.fromCharCode(ch);
          p++;
        }
        return out;
      }
      handleInterrupt(ah, cpu) {
        switch (ah) {
          case 0x09: {
            let p = cpu.linear(cpu.regs.DS, cpu.regs.EDX);
            let s = '';
            while (true) {
              const ch = cpu.mem.read8(p++);
              if (ch === 0x24) break;
              s += String.fromCharCode(ch);
            }
            logLine(s);
            return 0;
          }
          case 0x19: {
            cpu.regs.EAX = (cpu.regs.EAX & 0xFF00) | (this.currentDrive.charCodeAt(0) - 0x40);
            return 0;
          }
          case 0x2A: {
            const d = new Date();
            cpu.regs.ECX = (d.getFullYear() - 1980) & 0xFFFF;
            cpu.regs.EDX = ((d.getMonth() + 1) << 8) | d.getDate();
            return 0;
          }
          case 0x2C: {
            const d = new Date();
            cpu.regs.ECX = ((d.getHours() & 0xFF) << 8) | (d.getMinutes() & 0xFF);
            cpu.regs.EDX = ((d.getSeconds() & 0xFF) << 8);
            return 0;
          }
          case 0x30: {
            cpu.regs.EAX = 0x0622;
            return 0;
          }
          case 0x3C: {
            const path = this.readString(cpu, cpu.regs.DS, cpu.regs.EDX);
            this.files.set(path, '');
            cpu.regs.EAX = 1;
            return 0;
          }
          case 0x3D: {
            const path = this.readString(cpu, cpu.regs.DS, cpu.regs.EDX);
            cpu.regs.EAX = this.files.has(path) ? 5 : 0xFFFF;
            return 0;
          }
          case 0x3E: {
            cpu.regs.EAX = 0;
            return 0;
          }
          case 0x3F: {
            const count = cpu.regs.ECX >>> 0;
            const path = this.readString(cpu, cpu.regs.DS, cpu.regs.EDX);
            const data = this.files.get(path) || '';
            const bytes = new TextEncoder().encode(data.slice(0, count));
            const dst = cpu.linear(cpu.regs.DS, cpu.regs.EDX + 0);
            for (let i = 0; i < bytes.length; i++) cpu.mem.write8(dst + i, bytes[i]);
            cpu.regs.EAX = bytes.length;
            return 0;
          }
          case 0x40: {
            const path = this.readString(cpu, cpu.regs.DS, cpu.regs.EDX);
            const count = cpu.regs.ECX >>> 0;
            const src = cpu.linear(cpu.regs.DS, cpu.regs.EDX);
            const chars = [];
            for (let i = 0; i < count; i++) chars.push(String.fromCharCode(cpu.mem.read8(src + i)));
            const text = chars.join('');
            this.files.set(path, (this.files.get(path) || '') + text);
            cpu.regs.EAX = count;
            return 0;
          }
          case 0x4C: {
            cpu.halted = true;
            return 0;
          }
          default:
            return 0;
        }
      }
    }

    class CommandShell {
      constructor(dos) { this.dos = dos; }
      runCommand(cmd, vga) {
        const c = cmd.trim();
        if (!c) return;
        const parts = c.split(/\s+/);
        const base = parts[0].toUpperCase();
        switch (base) {
          case 'DIR': {
            const entries = [...this.dos.files.keys()].map(k => k.replace(/^C:\\/i, ''));
            entries.forEach(e => logLine(e));
            break;
          }
          case 'CLS':
            if (vga) {
              vga.textBuffer.fill(0x0720);
              vga.cursorX = 0; vga.cursorY = 0; vga.renderText();
            }
            break;
          case 'VER':
            logLine('Microsoft DOS 6.22-compatible environment');
            break;
          case 'ECHO':
            logLine(parts.slice(1).join(' '));
            break;
          case 'TYPE':
            if (parts[1]) {
              const file = this.dos.files.get('C:\\' + parts[1]) || this.dos.files.get(parts[1]);
              if (file !== undefined) logLine(file);
              else logLine('File not found');
            }
            break;
          case 'HELP':
            logLine('DIR  CLS  VER  ECHO  TYPE  HELP  EXIT');
            break;
          case 'EXIT':
            logLine('Leaving DOS...');
            break;
          default:
            logLine('Bad command or file name');
        }
      }
    }

    class VM {
      constructor() {
        this.mem = new Memory(16 * MB);
        this.io = new IOBus();
        this.canvas = document.getElementById('display');
        this.vga = new VGA(this.canvas);
        this.keyboard = new Keyboard();
        this.cpu = new CPU386(this.mem, this.io, null);
        this.bios = new BIOS(this.mem, this.cpu);
        this.cpu.bios = this.bios;
        this.disk = new VirtualDisk();
        this.disk.initializeBootSector();
        this.dos = new DOSKernel();
        this.shell = new CommandShell(this.dos);
        this.running = false;
        this.paused = false;
        this.tick = null;
        window.__vm = this;
        this.setup();
      }

      setup() {
        this.bios.init();
        this.cpu.reset();
        this.cpu.regs.CS = 0xF000;
        this.cpu.regs.EIP = 0xFFF0;
        this.cpu.regs.ESP = 0x7C00;
        this.cpu.regs.SS = 0;
        this.cpu.regs.ES = 0x9000;
        this.cpu.regs.DS = 0x9000;
        this.vga.setMode(0x03);
        this.vga.refresh();
        this.mem.write16(0x7C00 + 510, 0xAA55);
        this.mem.write8(0x7C00, 0xEB);
        this.mem.write8(0x7C00 + 1, 0x3C);
        this.mem.write8(0x7C00 + 2, 0x90);
      }

      boot() {
        this.running = true;
        this.paused = false;
        document.getElementById('vmState').textContent = 'booting';
        logLine('IBM PC-compatible BIOS POST');
        logLine('Memory check: 004096K OK');
        logLine('Booting from IDE C:');
        logLine('MS-DOS 6.22-compatible environment');
        logLine('C:\\>');
        this.start();
      }

      start() {
        if (this.tick) return;
        this.tick = setInterval(() => this.step(), 16);
      }

      stop() {
        if (this.tick) clearInterval(this.tick);
        this.tick = null;
      }

      pause() {
        this.paused = !this.paused;
        document.getElementById('vmState').textContent = this.paused ? 'paused' : 'running';
      }

      step() {
        if (!this.running || this.paused) return;
        for (let i = 0; i < 300; i++) {
          const before = this.cpu.regs.EIP;
          const r = this.cpu.step();
          if (r === 0) {
            document.getElementById('debugOutput').value = JSON.stringify(this.cpu.getState(), null, 2) + '\n' + JSON.stringify(this.bios.lastError || {}, null, 2);
            this.running = false;
            document.getElementById('vmState').textContent = 'halted';
            return;
          }
          if (this.keyboard.hasKey()) {
            const key = this.keyboard.readKey();
            const ch = key & 0xFF;
            if (ch === 13) { logLine(''); }
            else if (ch === 8) { /* backspace ignored for now */ }
            else if (ch >= 32 && ch <= 126) { logLine(String.fromCharCode(ch)); }
          }
          if (this.cpu.regs.EIP === before && this.cpu.lastInstr.includes('UNSUPPORTED')) {
            this.running = false;
            return;
          }
        }
        document.getElementById('modeLabel').textContent = this.cpu.mode;
        document.getElementById('debugOutput').value = JSON.stringify(this.cpu.getState(), null, 2);
      }

      reset() {
        this.stop();
        this.setup();
        this.boot();
      }
    }

    const vm = new VM();

    document.getElementById('powerBtn').addEventListener('click', () => vm.boot());
    document.getElementById('resetBtn').addEventListener('click', () => vm.reset());
    document.getElementById('pauseBtn').addEventListener('click', () => vm.pause());
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      const c = document.getElementById('display');
      if (c.requestFullscreen) c.requestFullscreen();
    });
    document.getElementById('factoryBtn').addEventListener('click', () => {
      location.reload();
    });
    document.getElementById('cpuHz').addEventListener('change', (e) => {
      document.getElementById('clockLabel').textContent = e.target.value + ' MHz';
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          const bytes = new Uint8Array(reader.result);
          const dec = new TextDecoder('latin1');
          const text = dec.decode(bytes.slice(0, 4096));
          vm.dos.files.set('C:\\' + file.name, text);
          logLine('Imported: ' + file.name);
        };
        reader.readAsArrayBuffer(file);
      });
      e.target.value = '';
    });

    document.getElementById('clockLabel').textContent = '33 MHz';
    document.getElementById('ramLabel').textContent = '4 MB';
    document.getElementById('vmState').textContent = 'powered off';
    logLine('System ready.');
  </script>
</body>
